name: selftest-macos
on:
  workflow_dispatch:
jobs:
  t:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - run: |
          echo "OS=${{ matrix.os }}"
          sw_vers
          uname -m
          xcodebuild -version
